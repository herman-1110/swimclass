<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#14212B;background:#FFFFFF}
a{color:#0B5E7A}a:hover{color:#084A61}
.frame{container-type:inline-size;width:100%;position:relative}
.shell{display:flex;flex-direction:column;min-height:800px;background:#FFFFFF;font-family:'Figtree',system-ui,sans-serif;color:#14212B}
.side{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:auto;padding:4px 8px 16px;border-top:1px solid #ECECE9;background:#FFFFFF;position:sticky;bottom:0;z-index:2}
@container (min-width: 1024px){
.shell{flex-direction:row}
.side{display:flex;flex-direction:column;gap:32px;width:220px;flex-shrink:0;box-sizing:border-box;padding:28px 14px 24px;border-right:1px solid #ECECE9}
.tabs{display:none}
}
.auth{min-height:800px;display:flex;background:#FFFFFF;font-family:'Figtree',system-ui,sans-serif;color:#14212B}
.card{flex:1;box-sizing:border-box;padding:72px 28px 40px;display:flex;flex-direction:column;gap:40px;background:#FFFFFF}
.card-foot{margin-top:auto}
@container (min-width: 768px){
.auth{align-items:center;justify-content:center;padding:40px;box-sizing:border-box;background:#F6F6F4}
.card{flex:none;width:100%;max-width:420px;padding:40px;gap:32px;border:1px solid #E2E2DE;border-radius:16px}
.card-foot{margin-top:8px;padding-top:24px;border-top:1px solid #ECECE9}
}
</style>
</helmet>
<div class="frame">
<div class="auth">
<div class="card">
<div style="font-size: 14px; font-weight: 600; color: #0B5E7A">Swim Class Booking</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; line-height: 1.2">Welcome back</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5F6B73">Log in to book lessons and check your package.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="login-username" style="font-size: 13px; font-weight: 500; color: #5F6B73">Username</label>
<input id="login-username" type="text" autocomplete="username" placeholder="e.g. meiling" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D8D8D4; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #14212B">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="login-password" style="font-size: 13px; font-weight: 500; color: #5F6B73">Password</label>
<input id="login-password" type="password" autocomplete="current-password" placeholder="Your password" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D8D8D4; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #14212B">
</div>
<a href="MainDesktop.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; margin-top: 8px; border-radius: 10px; background: #0B5E7A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Log in</a>
<button type="button" style="align-self: center; min-height: 44px; padding: 0 8px; border: none; background: transparent; font-family: inherit; font-size: 14px; color: #5F6B73; cursor: pointer">Forgot username or password?</button>
</div>
<div class="card-foot" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<button type="button" style="min-height: 44px; padding: 0 8px; border: none; background: transparent; font-family: inherit; font-size: 14px; color: #14212B; cursor: pointer">New here? <span style="font-weight: 600; color: #0B5E7A">Create an account</span></button>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #5F6B73">Your coach approves new accounts before you can book.</p>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
